name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Format, build, migrations, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ProductManagement.sln

      - name: Build (warnings as errors)
        run: dotnet build ProductManagement.sln --no-restore

      - name: Verify formatting
        run: dotnet format ProductManagement.sln --verify-no-changes --severity warn --no-restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Verify EF Core migrations are in sync
        run: dotnet ef migrations has-pending-model-changes --project src/ProductManagement.Infrastructure --startup-project src/ProductManagement.Infrastructure

      - name: Run unit tests
        run: dotnet test --project tests/ProductManagement.UnitTests/ProductManagement.UnitTests.csproj --no-restore --no-build -- --report-trx --report-trx-filename unit-tests.trx --results-directory TestResults/unit

      - name: Publish unit test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests
          path: TestResults/unit/*.trx
          reporter: dotnet-trx

      - name: Upload unit test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: TestResults/unit
          retention-days: 7

  docker-tests:
    name: ${{ matrix.title }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: integration
            title: Integration Tests
            project: tests/ProductManagement.IntegrationTests/ProductManagement.IntegrationTests.csproj
          - id: acceptance
            title: Acceptance Tests
            project: tests/ProductManagement.AcceptanceTests/ProductManagement.AcceptanceTests.csproj
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Build
        run: dotnet build ${{ matrix.project }} --no-restore

      - name: Run tests
        run: dotnet test --project ${{ matrix.project }} --no-restore --no-build -- --report-trx --report-trx-filename ${{ matrix.id }}.trx --results-directory TestResults/${{ matrix.id }}

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.title }}
          path: TestResults/${{ matrix.id }}/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.id }}-test-results
          path: TestResults/${{ matrix.id }}
          retention-days: 7
